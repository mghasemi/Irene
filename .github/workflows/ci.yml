name: CI

on:
  push:
    branches: [main, master, rewrite]
  pull_request:
    branches: [main, master, rewrite]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        solver: [CLARABEL, SCS]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install clarabel scs pytest pytest-cov pyyaml
          pip install -e .

      - name: Verify solver availability
        run: |
          python -c "
          import cvxpy as cp
          available = cp.installed_solvers()
          solver = '${{ matrix.solver }}'
          assert solver in available, f'{solver} not installed. Available: {available}'
          print(f'{solver} ✓ — installed solvers: {[s for s in [\"CLARABEL\",\"SCS\",\"CVXOPT\"] if s in available]}')
          "

      - name: Run pytest with coverage (solver=${{ matrix.solver }})
        env:
          IRENE_CI_SOLVER: ${{ matrix.solver }}
        run: |
          python -m pytest \
            Irene/tests/ tests/ \
            --cov=Irene --cov-report=xml \
            --tb=short -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }},${{ matrix.solver }}
          name: coverage-py${{ matrix.python-version }}-${{ matrix.solver }}

      - name: Run benchmark gallery --quick (solver=${{ matrix.solver }})
        run: |
          cd benchmarks
          python run_gallery.py \
            --solver ${{ matrix.solver }} \
            --quick \
            --timeout 120 \
            --output-dir ./results/

      - name: Run separating examples regression test (solver=${{ matrix.solver }})
        env:
          IRENE_CI_SOLVER: ${{ matrix.solver }}
        run: |
          python -m pytest tests/test_separating_examples.py -v --tb=short

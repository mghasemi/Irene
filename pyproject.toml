[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "Irene"
version = "2.0.0.dev0"
description = "Polynomial optimization via SOS/SONC/SDP hierarchies — modernized rewrite with SymEngine, CVXPY, and structural reductions."
readme = "README.rst"
license = {text = "MIT"}
authors = [
    {name = "Mehdi Ghasemi", email = "mehdi.ghasemi@gmail.com"},
]
keywords = [
    "polynomial-optimization",
    "semidefinite-programming",
    "SOS",
    "SONC",
    "moment-problem",
    "differential-algebra",
]
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "symengine>=0.9",
    "numpy>=1.24",
    "scipy>=1.10",
    "cvxpy>=1.3",
    "cvxopt>=1.3",
    "gpkit>=1.0",
    "multiprocess>=0.70",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "pytest-cov>=4.0",
    "coverage>=7.0",
    "pyyaml>=6.0",
]
solvers = [
    "clarabel>=0.6",
    "scs>=3.0",
    "osqp>=1.0",
]

[tool.setuptools.packages.find]
include = ["Irene*", "pyProximation*"]

[tool.pytest.ini_options]
testpaths = ["Irene/tests/", "tests/"]
addopts = "--timeout=120 --tb=short -q"
filterwarnings = [
    "default::DeprecationWarning:Irene",
]

# ============================================================================
# IreneRewrite — Local CI via Docker Compose (P5.9)
# ============================================================================
# Usage:
#   docker compose up          # Run all 6 jobs (3 Python × 2 solvers)
#   docker compose up py311-clarabel  # Single job only
#   docker compose run py311-test     # Interactive shell for debugging
# ============================================================================

services:
  # ------------------------------------------------------------------
  # Python 3.10 jobs
  # ------------------------------------------------------------------
  py310-clarabel:
    build:
      context: .
      dockerfile: Dockerfile.ci
      args:
        PYTHON_VERSION: "3.10"
    environment:
      - IRENE_CI_SOLVER=CLARABEL
      - CI_PYTHON_VERSION=3.10
    volumes:
      - ./benchmarks/results:/code/benchmarks/results
    command: ["test"]

  py310-scs:
    build:
      context: .
      dockerfile: Dockerfile.ci
      args:
        PYTHON_VERSION: "3.10"
    environment:
      - IRENE_CI_SOLVER=SCS
      - CI_PYTHON_VERSION=3.10
    volumes:
      - ./benchmarks/results:/code/benchmarks/results
    command: ["test"]

  # ------------------------------------------------------------------
  # Python 3.11 jobs (primary dev version)
  # ------------------------------------------------------------------
  py311-clarabel:
    build:
      context: .
      dockerfile: Dockerfile.ci
      args:
        PYTHON_VERSION: "3.11"
    environment:
      - IRENE_CI_SOLVER=CLARABEL
      - CI_PYTHON_VERSION=3.11
    volumes:
      - ./benchmarks/results:/code/benchmarks/results
    command: ["test"]

  py311-scs:
    build:
      context: .
      dockerfile: Dockerfile.ci
      args:
        PYTHON_VERSION: "3.11"
    environment:
      - IRENE_CI_SOLVER=SCS
      - CI_PYTHON_VERSION=3.11
    volumes:
      - ./benchmarks/results:/code/benchmarks/results
    command: ["test"]

  # ------------------------------------------------------------------
  # Python 3.12 jobs (forward-compat check)
  # ------------------------------------------------------------------
  py312-clarabel:
    build:
      context: .
      dockerfile: Dockerfile.ci
      args:
        PYTHON_VERSION: "3.12"
    environment:
      - IRENE_CI_SOLVER=CLARABEL
      - CI_PYTHON_VERSION=3.12
    volumes:
      - ./benchmarks/results:/code/benchmarks/results
    command: ["test"]

  py312-scs:
    build:
      context: .
      dockerfile: Dockerfile.ci
      args:
        PYTHON_VERSION: "3.12"
    environment:
      - IRENE_CI_SOLVER=SCS
      - CI_PYTHON_VERSION=3.12
    volumes:
      - ./benchmarks/results:/code/benchmarks/results
    command: ["test"]
